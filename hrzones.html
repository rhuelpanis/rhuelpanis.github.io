<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Heart Rate Zones</title>
</head>
<body>
<div class="container">
  <div class="row">
    <div class="col-md-3"></div>
    <div class="col-md-6">
      <br>
      <form id="hrzoneForm">
        <div class="mb-3">
          <label for="age" class="form-label">Age:</label>
          <input id="age" name="age" type="number" class="form-control" placeholder="Enter age">
        </div>
        <div class="mb-3">
          <label for="resthr" class="form-label">Resting Heart Rate:</label>
          <input id="resthr" name="resthr" type="number" class="form-control" placeholder="Enter resting HR">
        </div>
        <div class="mb-3">
          <label for="maxhractual" class="form-label">Maximum Heart Rate (leave blank if unknown):</label>
          <input id="maxhractual" name="maxhractual" type="number" class="form-control" placeholder="Optional">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
      <hr/>
      <div id="results"></div>
    </div>
    <div class="col-md-3"></div>
  </div>
</div>

<script>
document.getElementById("hrzoneForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const age = parseInt(document.getElementById("age").value) || 0;
  const restHR = parseInt(document.getElementById("resthr").value) || 0;
  let maxHR = document.getElementById("maxhractual").value;

  if (!maxHR) {
    maxHR = 220 - age;
  } else {
    maxHR = parseInt(maxHR);
  }

  // Calculate zones using Karvonen formula
  const z1f = Math.round((maxHR - restHR) * 0.5 + restHR);
  const z2f = Math.round((maxHR - restHR) * 0.6 + restHR);
  const z3f = Math.round((maxHR - restHR) * 0.7 + restHR);
  const z4f = Math.round((maxHR - restHR) * 0.8 + restHR);
  const z5f = Math.round((maxHR - restHR) * 0.9 + restHR);
  const zSSL = Math.round((maxHR - restHR) * 0.75 + restHR);
  const zSSH = Math.round((maxHR - restHR) * 0.85 + restHR);

  const z1t = z2f - 1;
  const z2t = z3f - 1;
  const z3t = z4f - 1;
  const z4t = z5f - 1;

  // Display results in a table
  let output = `
    <table class="table table-bordered">
      <tr><th>Zone</th><th>Range (bpm)</th></tr>
      <tr><td>Zone 1</td><td>${z1f} - ${z1t}</td></tr>
      <tr><td>Zone 2</td><td>${z2f} - ${z2t}</td></tr>
      <tr><td>Zone 3</td><td>${z3f} - ${z3t}</td></tr>
      <tr><td>Zone 4</td><td>${z4f} - ${z4t}</td></tr>
      <tr><td>Zone 5</td><td>${z5f} - ${maxHR}</td></tr>
      <tr><td>Sweet Spot</td><td>${zSSL} - ${zSSH}</td></tr>
    </table>
  `;

  document.getElementById("results").innerHTML = output;
});
</script>
</body>
</html>
