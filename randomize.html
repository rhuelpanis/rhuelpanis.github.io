<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<title>randomize</title>
</head>
<body>
<div class='container'>
	<div class='row'>
		<div class='col-md-3'></div>
		<div class='col-md-6'>
				<br><br>
				<form id="entryForm">
				<input type="text" id="entry" name="num1"><br><br>
				</form>

				 <input type="button" onclick="add()" value="Add">
				 <input type="button" onclick="rand()" value="Random">
				  <br>
				  <br>
				  <p id="listahan"> </p>
		</div>		  
		<div class='col-md-3'></div>		  
	</div>
</div>
<script>
var entries=[];

function add() { 
	entries.push(document.getElementById("entry").value); 
	let newEntry = document.getElementById("entry").value;
	refreshList();
	resetForm();
}

function rand() {
	var randEntry = entries[Math.floor(Math.random()*entries.length)];
	window.alert(randEntry);
	refreshList();
}

function refreshList() {
	let list=""
	for (let number = 0; number < entries.length; number++) {
		let numberPlusOne = number + 1;
		list += numberPlusOne + ". " + entries[number] + "<br>";
	}
	document.getElementById("listahan").innerHTML = list;
}

function resetForm() {
  document.getElementById("entryForm").reset();
}

</script>



</body>
</html>
